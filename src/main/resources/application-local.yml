spring:
  datasource:
    # Local development - Identity/Auth user
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:banco_digital_identity}
    username: auth_user
    password: ${IDENTITY_DB_PASSWORD:changemeinlocalenv}
  cloud:
    vault:
      enabled: false
  jpa:
    show-sql: true



logging:
  level:
    com.udea.bancodigital: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
