spring:
  cloud:
    vault:
      enabled: false
    config:
      enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 1s
      timeout: 1s
  jpa:
    show-sql: false

# Disable Eureka for Cloud Run
eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

# Disable Kafka consumers for Cloud Run
spring.kafka:
  bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  listener:
    auto-startup: false

spring.cloud.stream:
  kafka:
    binder:
      auto-startup: false

# Disable Zipkin
spring.zipkin:
  enabled: false

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
    kafka:
      enabled: false

logging:
  level:
    root: WARN
    com.udea.bancodigital: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
