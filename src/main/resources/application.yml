spring:
  application:
    name: identity-service
  profiles:
    active: ${APP_PROFILE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banco_digital_identity}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Eureka Service Discovery
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    instanceId: ${spring.application.name}:${server.port}
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 30
    leaseExpirationDurationInSeconds: 90

# Distributed Tracing
spring.zipkin:
  base-url: ${ZIPKIN_URL:http://localhost:9411/}
  enabled: true
spring.sleuth:
  sampler:
    probability: 1.0

server:
  port: ${PORT:${APP_PORT:8081}}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev_secret_replace_in_prod_must_be_256bits}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:3}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    password-policy:
      min-length: ${PASSWORD_MIN_LENGTH:8}
      require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      require-numbers: ${PASSWORD_REQUIRE_NUMBERS:true}
      require-special-chars: ${PASSWORD_REQUIRE_SPECIAL_CHARS:true}
      prevent-reuse: ${PASSWORD_PREVENT_REUSE:true}
    account-lockout:
      max-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}
    default-client-password: ${DEFAULT_CLIENT_PASSWORD:Temp1234!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  api:
    version: v1

---

# Vault Profile - Secrets loaded from Vault
spring:
  config:
    activate:
      on-profile: vault
  datasource:
    username: ${vault.datasource.username:postgres}
    password: ${vault.datasource.password:admin}

app:
  security:
    jwt:
      secret: ${jwt_secret:dev_secret_replace_in_prod_must_be_256bits}
      expiration-ms: ${jwt_expiration_ms:3600000}
      refresh-expiration-ms: ${jwt_refresh_expiration_ms:86400000}
    login:
      max-failed-attempts: ${login_max_failed_attempts:3}
      lockout-minutes: ${login_lockout_minutes:15}
    password-policy:
      min-length: ${password_min_length:8}
      require-uppercase: ${password_require_uppercase:true}
      require-lowercase: ${password_require_lowercase:true}
      require-numbers: ${password_require_numbers:true}
      require-special-chars: ${password_require_special_chars:true}
      prevent-reuse: ${password_prevent_reuse:true}
    account-lockout:
      max-attempts: ${account_lockout_max_attempts:5}
      lockout-duration-minutes: ${account_lockout_duration_minutes:30}
    default-client-password: ${default_client_password:Temp1234!}
