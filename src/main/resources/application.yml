spring:
  application:
    name: identity-service
  profiles:
    active: ${APP_PROFILE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banco_digital_identity}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Eureka Service Discovery
  eureka:
    client:
      serviceUrl:
        defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
      registerWithEureka: true
      fetchRegistry: true
    instance:
      instanceId: ${spring.application.name}:${server.port}
      preferIpAddress: true
      leaseRenewalIntervalInSeconds: 30
      leaseExpirationDurationInSeconds: 90

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: com.udea.bancodigital

  # Distributed Tracing
  zipkin:
    base-url: ${ZIPKIN_URL:http://localhost:9411/}
    enabled: true
  sleuth:
    sampler:
      probability: 1.0

server:
  port: ${PORT:${APP_PORT:8081}}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev_secret_replace_in_prod_must_be_256bits}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:3}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    default-client-password: ${DEFAULT_CLIENT_PASSWORD:Temp1234!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  api:
    version: v1

---

# Vault Profile - Secrets loaded from Vault
spring:
  config:
    activate:
      on-profile: vault
  datasource:
    username: ${vault.datasource.username:postgres}
    password: ${vault.datasource.password:admin}

app:
  security:
    jwt:
      secret: ${jwt_secret:dev_secret_replace_in_prod_must_be_256bits}
      expiration-ms: ${jwt_expiration_ms:3600000}
      refresh-expiration-ms: ${jwt_refresh_expiration_ms:86400000}
    login:
      max-failed-attempts: ${login_max_failed_attempts:3}
      lockout-minutes: ${login_lockout_minutes:15}
    default-client-password: ${default_client_password:Temp1234!}
